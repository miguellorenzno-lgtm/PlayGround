<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cidade Noturna</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;font-family:Inter,system-ui,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between}.brand{letter-spacing:.26em;font-weight:900;font-size:12px}.brand b{color:#57d5ff}.stats{display:flex;gap:8px}.pill{height:48px;min-width:92px;padding:8px 12px;border:1px solid rgba(255,255,255,.14);background:rgba(8,13,18,.75);border-radius:7px;text-align:right}.pill small{display:block;color:#9aa4af;font-size:8px;letter-spacing:.18em}.pill strong{font-size:18px}#objective{position:absolute;top:84px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(5,8,12,.65);font-size:9px;letter-spacing:.16em}#objective b{color:#66dcff}
#speed{position:absolute;left:30px;bottom:28px;width:180px}#speed strong{font-size:50px;font-style:italic}#speed span{font-size:9px;color:#adb5bc;margin-left:8px}.bar{height:4px;width:170px;margin-top:7px;background:rgba(255,255,255,.14)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35e0ff,#fff176,#ff7b22)}
#minimap{position:absolute;right:24px;bottom:26px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(5,8,12,.82);overflow:hidden}.map-road{position:absolute;left:50%;top:-20%;width:36px;height:150%;transform:translateX(-50%) rotate(8deg);background:#303640}.map-player{position:absolute;left:71px;top:84px;width:7px;height:15px;background:#fff;border-radius:4px 4px 2px 2px}.map-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#66dcff;box-shadow:0 0 7px #66dcff}
#menu,#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(2,5,8,.85),rgba(2,5,8,.25),rgba(2,5,8,.85));z-index:5}.panel{text-align:center;max-width:620px;padding:24px}.tag{font-size:10px;letter-spacing:.35em;color:#66dcff}.panel h1{font-size:clamp(48px,9vw,96px);line-height:.82;margin:18px 0 14px;font-style:italic;letter-spacing:-7px;text-transform:uppercase}.panel h1 span{color:#66dcff}.panel p{color:#bbc3c9;line-height:1.6}.panel button{pointer-events:auto;border:1px solid rgba(255,255,255,.22);border-radius:4px;background:#eceff1;color:#111;padding:15px 28px;font-weight:900;letter-spacing:.14em;cursor:pointer}.hidden{display:none!important}
#controls{display:none}.touch{position:absolute;bottom:18px;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(10,15,20,.38);color:white;font-size:24px;pointer-events:auto}#left{left:18px}#right{left:104px}#boost{right:18px;border-color:rgba(86,213,255,.6);color:#66dcff}
@media(max-width:700px){.top{top:12px;left:12px;right:12px}.brand{display:none}.pill{height:42px;min-width:72px}.distance{display:none}.top{justify-content:flex-end}#objective{top:62px;font-size:7px}#speed{left:20px;bottom:108px;transform:scale(.72);transform-origin:left bottom}#minimap{width:88px;height:88px;right:12px;bottom:105px}.map-player{left:40px;top:49px}.map-road{width:22px;height:130%}.panel h1{letter-spacing:-4px}#controls{display:block}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="top"><div class="brand">CIDADE <b>// NOTURNA</b></div><div class="stats"><div class="pill"><small>DISTÂNCIA</small><strong id="dist">0.00 KM</strong></div><div class="pill distance"><small>RECORDE</small><strong id="best">0.00 KM</strong></div><div class="pill"><small>ITENS</small><strong id="items">00</strong></div></div></div>
<div id="objective">MISSÃO: <b>ENCONTRE 20 PRODUTOS</b></div><div id="speed"><strong id="kmh">000</strong><span>RITMO</span><div class="bar"><i id="rpm"></i></div></div><div id="minimap"><div class="map-road"></div><div id="mapDots"></div><div class="map-player"></div></div></div>
<div id="menu"><div class="panel"><div class="tag">AVENTURA URBANA</div><h1>Cidade<br><span>Noturna</span></h1><p>Caminhe pela rua, passe pela escola e pelas lojas e encontre celulares, televisões, computadores e consoles PS4/PS5.</p><button id="start">COMEÇAR</button></div></div>
<div id="result" class="hidden"><div class="panel"><div class="tag" id="resultTag">MISSÃO CONCLUÍDA</div><h1 id="resultTitle">CIDADE<br><span>EXPLORADA</span></h1><p id="resultText"></p><button id="again">JOGAR NOVAMENTE</button></div></div>
<div id="controls"><button class="touch" id="left">◀</button><button class="touch" id="right">▶</button><button class="touch" id="boost">●</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);
const keys={},touch={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function bind(id,key){let e=document.getElementById(id);e.addEventListener('pointerdown',q=>{q.preventedDefault;q.preventDefault();touch[key]=1});e.addEventListener('pointerup',()=>touch[key]=0);e.addEventListener('pointercancel',()=>touch[key]=0)}bind('left','left');bind('right','right');bind('boost','boost');
let state='menu',last=0,speed=0,playerX=0,roadOffset=0,distance=0,items=0,objects=[],pedestrians=[],shake=0;
let best=+(localStorage.cityBest||0);document.getElementById('best').textContent=best.toFixed(2)+' KM';
function reset(){speed=0;playerX=0;roadOffset=0;distance=0;items=0;objects=[];pedestrians=[];for(let i=0;i<16;i++)objects.push(makeObject(i));for(let i=0;i<8;i++)pedestrians.push({lane:(Math.random()*3|0)-1,z:180+i*260+Math.random()*150,color:['#df9a52','#3a85a8','#b55a67','#d3b66d','#7c8eaa'][i%5]});document.getElementById('dist').textContent='0.00 KM';document.getElementById('items').textContent='00'}
function makeObject(i){const types=['Celular','TV','PC','PS5','PS4'];return{lane:(Math.random()*3|0)-1,z:260+i*270+Math.random()*170,type:types[i%types.length],caught:false}}
function start(){reset();state='run';document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden')}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function finish(){state='result';if(distance>best){best=distance;localStorage.cityBest=best.toFixed(2)}document.getElementById('best').textContent=best.toFixed(2)+' KM';document.getElementById('resultText').textContent=distance.toFixed(2)+' km • '+items+' produtos encontrados';document.getElementById('result').classList.remove('hidden')}
function project(lane,z){const horizon=H*.38,p=1-Math.max(0,Math.min(1,z/1100));const y=horizon+(H-horizon)*p*p,half=W*(.18+.52*p);return{x:W/2+lane*half*.48,y,scale:.12+p*.95,half}}
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H*.58);g.addColorStop(0,'#101c29');g.addColorStop(.48,'#526878');g.addColorStop(.82,'#b39a80');g.addColorStop(1,'#dfc49d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.46);
 // céu realista: nuvens e poluição atmosférica suave
 ctx.save();ctx.globalAlpha=.16;for(let i=0;i<9;i++){let x=(i*211-roadOffset*.018)%(W+350)-175,y=H*(.055+(i%4)*.055);let cg=ctx.createRadialGradient(x,y,4,x,y,96);cg.addColorStop(0,'#eef2ef');cg.addColorStop(.55,'rgba(210,218,216,.55)');cg.addColorStop(1,'rgba(180,190,192,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.arc(x,y,96,0,Math.PI*2);ctx.fill()}ctx.restore();
 let sx=W*.74,sy=H*.16;let sg=ctx.createRadialGradient(sx,sy,2,sx,sy,42);sg.addColorStop(0,'rgba(255,249,214,.95)');sg.addColorStop(.18,'rgba(255,228,169,.55)');sg.addColorStop(1,'rgba(255,205,145,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,42,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,248,210,.82)';ctx.beginPath();ctx.arc(sx,sy,8,0,7);ctx.fill();
}
function drawBuildings(){
 const horizon=H*.38;ctx.fillStyle='#8b918d';ctx.fillRect(0,horizon,W,H*.105);
 for(let i=-2;i<22;i++){
  let cycle=((i*118-roadOffset*.16)%(W+300)+(W+300))%(W+300)-150;
  let bw=92+(i%4)*24,bh=H*(.13+(i%5)*.028),base=horizon+H*.018;
  let facade=i%5===0?'#8b7e6b':i%5===1?'#6f7c7d':i%5===2?'#9b8d79':i%5===3?'#73766d':'#867a6d';
  let vg=ctx.createLinearGradient(cycle,0,cycle+bw,0);vg.addColorStop(0,'#31383a');vg.addColorStop(.16,facade);vg.addColorStop(.82,facade);vg.addColorStop(1,'#343a3a');ctx.fillStyle=vg;ctx.fillRect(cycle,base-bh,bw,bh);
  ctx.fillStyle='rgba(25,30,31,.28)';ctx.fillRect(cycle+bw*.82,base-bh,bw*.18,bh);
  // fachadas, juntas e varandas
  ctx.fillStyle='rgba(65,57,49,.34)';for(let y=base-bh+14;y<base-8;y+=27)ctx.fillRect(cycle,y,bw,1);
  for(let wy=base-bh+20;wy<base-16;wy+=27)for(let wx=cycle+11;wx<cycle+bw-10;wx+=25){let warm=(wx+wy+i)%7===0;ctx.fillStyle=warm?'#d6b477':'#263c43';ctx.fillRect(wx,wy,14,17);ctx.fillStyle='rgba(210,225,220,.14)';ctx.fillRect(wx+2,wy+2,3,13)}
  ctx.strokeStyle='rgba(38,41,40,.7)';ctx.lineWidth=2;ctx.strokeRect(cycle,base-bh,bw,bh);
 }
}
function drawSchool(){let z=((680-roadOffset*.9)%1500+1500)%1500;if(z<30||z>1100)return;let q=project(-1.55,z),s=q.scale*1.2,w=180*s,h=150*s,x=q.x-W*.06,y=q.y-h*.25;ctx.save();ctx.translate(x,y);ctx.fillStyle='#b9b09c';ctx.fillRect(-w/2,-h,w,h);ctx.fillStyle='#47525a';ctx.fillRect(-w/2,-h,w,18*s);ctx.fillStyle='#263741';for(let i=-1;i<=1;i++){ctx.fillRect(i*w*.25-25*s,-h*.65,50*s,54*s)}ctx.fillStyle='#252a2d';ctx.fillRect(-28*s,-38*s,56*s,38*s);ctx.fillStyle='#eee7cc';ctx.font=`${12*s}px sans-serif`;ctx.textAlign='center';ctx.fillText('ESCOLA',0,-h*.95);ctx.restore()}
function drawHouseStore(){for(let side of [-1,1]){let z=((side===-1?520:880-roadOffset*.5)%1500+1500)%1500;if(z<30||z>1100)continue;let q=project(side*1.55,z),s=q.scale*1.15,w=155*s,h=145*s,x=q.x,y=q.y-h*.1;ctx.save();ctx.translate(x,y);ctx.fillStyle=side<0?'#d19a62':'#b75d50';ctx.fillRect(-w/2,-h,w,h*.9);ctx.fillStyle=side<0?'#65452f':'#572b2b';ctx.beginPath();ctx.moveTo(-w*.58,-h);ctx.lineTo(0,-h*1.35);ctx.lineTo(w*.58,-h);ctx.fill();ctx.fillStyle='#26343c';ctx.fillRect(-w*.28,-h*.55,w*.56,h*.55);ctx.fillStyle='#ffe19a';ctx.fillRect(-w*.22,-h*.48,w*.44,h*.32);ctx.fillStyle='#eee';ctx.font=`${11*s}px sans-serif`;ctx.textAlign='center';ctx.fillText(side<0?'CASA':'LOJA ELETRÔNICA',0,-h*.78);ctx.restore()}}
function drawRoad(){
 const horizon=H*.38,g=ctx.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#59615f');g.addColorStop(.32,'#3b4141');g.addColorStop(.72,'#292d2e');g.addColorStop(1,'#1c2021');ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);
 ctx.fillStyle='#777d78';ctx.beginPath();ctx.moveTo(W*.455,horizon);ctx.lineTo(W*.545,horizon);ctx.lineTo(W*.86,H);ctx.lineTo(W*.14,H);ctx.fill();
 // textura granulada e faixas desgastadas
 ctx.save();ctx.globalAlpha=.12;for(let i=0;i<90;i++){let x=(i*137-roadOffset*.37)%W,y=horizon+(i*83%((H-horizon)|1));ctx.fillStyle=i%3?'#d3d0bc':'#090d0d';ctx.fillRect(x,y,1+(i%4),1)}ctx.restore();
 ctx.fillStyle='#505a54';ctx.fillRect(0,horizon,W*.14,H-horizon);ctx.fillRect(W*.86,horizon,W*.14,H-horizon);
 ctx.fillStyle='rgba(195,199,188,.32)';for(let lane=-1.5;lane<=1.5;lane+=1.5){for(let i=0;i<28;i++){let z=((i*48-roadOffset*1.35)%1340+1340)%1340;if(z<20)continue;let a=project(lane,z),b=project(lane,Math.max(0,z-34)),p=1-z/1100;ctx.fillStyle=`rgba(225,226,211,${.22+.52*p})`;ctx.beginPath();ctx.moveTo(a.x-2*p,a.y);ctx.lineTo(a.x+2*p,a.y);ctx.lineTo(b.x+4*p,b.y);ctx.lineTo(b.x-4*p,b.y);ctx.fill()}}
 ctx.fillStyle='#b7b8ad';ctx.beginPath();ctx.moveTo(W*.43,horizon);ctx.lineTo(W*.14,H);ctx.lineTo(W*.115,H);ctx.lineTo(W*.445,horizon);ctx.fill();ctx.beginPath();ctx.moveTo(W*.57,horizon);ctx.lineTo(W*.86,H);ctx.lineTo(W*.885,H);ctx.lineTo(W*.555,horizon);ctx.fill();
 // calçadas laterais e sarjetas
 ctx.fillStyle='#77766d';ctx.fillRect(0,horizon,W*.105,H-horizon);ctx.fillRect(W*.895,horizon,W*.105,H-horizon);ctx.fillStyle='rgba(20,24,23,.8)';ctx.fillRect(W*.105,horizon,7,H-horizon);ctx.fillRect(W*.895,horizon,7,H-horizon);
}
function drawPerson(p){
 let q=project(p.lane,p.z);if(p.z<25||p.z>1100)return;let s=q.scale,h=106*s,x=q.x,y=q.y;
 let skin=['#c9936f','#956246','#ddb18d','#70442f','#b97854'][Math.abs(p.lane+2)%5],hair=['#241916','#49372a','#171719','#5e3d2b'][Math.abs(p.z|0)%4];
 let walk=Math.sin(p.z*.025+roadOffset*.025),coat=p.color||'#445a66';
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(4*s,4*s,26*s,7*s,-.08,0,7);ctx.fill();
 // pernas com calças, joelhos e movimento natural
 ctx.strokeStyle='#252a2e';ctx.lineCap='round';ctx.lineWidth=10*s;ctx.beginPath();ctx.moveTo(-8*s,-h*.34);ctx.lineTo((-8+walk*5)*s,-h*.08);ctx.lineTo((-11+walk*8)*s,0);ctx.moveTo(8*s,-h*.34);ctx.lineTo((8-walk*5)*s,-h*.08);ctx.lineTo((11-walk*8)*s,0);ctx.stroke();
 ctx.strokeStyle='#151719';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo((-11+walk*8)*s,-2*s);ctx.lineTo((-18+walk*8)*s,1*s);ctx.moveTo((11-walk*8)*s,-2*s);ctx.lineTo((18-walk*8)*s,1*s);ctx.stroke();
 // tronco anatomico, luz lateral e pregas
 let cg=ctx.createLinearGradient(-18*s,-h*.78,20*s,-h*.25);cg.addColorStop(0,'rgba(255,255,255,.18)');cg.addColorStop(.25,coat);cg.addColorStop(1,'#242d31');ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(-15*s,-h*.74);ctx.quadraticCurveTo(-21*s,-h*.48,-16*s,-h*.27);ctx.lineTo(17*s,-h*.27);ctx.quadraticCurveTo(21*s,-h*.48,14*s,-h*.74);ctx.quadraticCurveTo(0,-h*.82,-15*s,-h*.74);ctx.fill();
 ctx.fillStyle='rgba(20,20,20,.25)';ctx.fillRect(-1*s,-h*.72,2*s,h*.43);
 // braços e mãos
 ctx.strokeStyle=coat;ctx.lineWidth=8*s;ctx.beginPath();ctx.moveTo(-14*s,-h*.68);ctx.quadraticCurveTo((-25-walk*3)*s,-h*.45,-20*s,-h*.25);ctx.moveTo(14*s,-h*.68);ctx.quadraticCurveTo((25+walk*3)*s,-h*.45,20*s,-h*.25);ctx.stroke();
 ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-20*s,-h*.23,4.2*s,0,7);ctx.arc(20*s,-h*.23,4.2*s,0,7);ctx.fill();
 // pescoço, orelhas e cabeça
 ctx.fillStyle=skin;ctx.fillRect(-5*s,-h*.83,10*s,9*s);ctx.beginPath();ctx.arc(-13*s,-h*.91,3*s,0,7);ctx.arc(13*s,-h*.91,3*s,0,7);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,-h*.92,13*s,16*s,.03,0,7);ctx.fill();
 // cabelo, sobrancelhas e olhos sutis
 ctx.fillStyle=hair;ctx.beginPath();ctx.ellipse(-1*s,-h*.99,13*s,8*s,.05,Math.PI,Math.PI*2);ctx.lineTo(12*s,-h*.94);ctx.quadraticCurveTo(8*s,-h*1.02,-13*s,-h*.96);ctx.fill();
 ctx.strokeStyle='rgba(25,20,18,.75)';ctx.lineWidth=1.2*s;ctx.beginPath();ctx.moveTo(-7*s,-h*.93);ctx.lineTo(-3*s,-h*.94);ctx.moveTo(3*s,-h*.94);ctx.lineTo(7*s,-h*.93);ctx.stroke();
 ctx.fillStyle='#1a1a18';ctx.beginPath();ctx.arc(-5*s,-h*.9,1.1*s,0,7);ctx.arc(5*s,-h*.9,1.1*s,0,7);ctx.fill();
 ctx.restore();
}
function drawObject(o){let q=project(o.lane,o.z);if(o.caught||o.z<25||o.z>1100)return;let s=q.scale*o.z/300;if(s<.08)return;let x=q.x,y=q.y,w=38*s,h=28*s;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(66,213,255,.18)';ctx.beginPath();ctx.arc(0,-h*.45,35*s,0,7);ctx.fill();ctx.fillStyle='#111';if(o.type==='Celular'){ctx.fillRect(-w*.18,-h*.85,w*.36,h)}else if(o.type==='TV'||o.type==='PC'||o.type==='PS5'||o.type==='PS4'){ctx.fillRect(-w*.5,-h*.8,w,h*.8);ctx.fillStyle='#75a3af';ctx.fillRect(-w*.42,-h*.72,w*.84,h*.55);ctx.fillStyle='#fff';ctx.font=`${8*s}px sans-serif`;ctx.textAlign='center';ctx.fillText(o.type,0,-h*.38)}ctx.restore()}
function drawPlayer(){let x=W/2+playerX*W*.34,y=H*.82,s=Math.min(W*.16,130),ctxX=x;ctx.save();ctx.translate(ctxX,y);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,s*.25,s*.42,s*.12,0,0,7);ctx.fill();ctx.fillStyle='#e5edf0';ctx.beginPath();ctx.arc(0,-s*.75,s*.18,0,7);ctx.fill();ctx.fillStyle='#c69367';ctx.beginPath();ctx.arc(0,-s*.82,s*.12,0,7);ctx.fill();ctx.fillStyle='#31556a';ctx.fillRect(-s*.23,-s*.65,s*.46,s*.55);ctx.fillStyle='#20272d';ctx.fillRect(-s*.2,-s*.1,s*.14,s*.38);ctx.fillRect(s*.06,-s*.1,s*.14,s*.38);ctx.restore()}
function update(dt){if(state!=='run')return;const boosting=(keys.shift||touch.boost);const target=boosting?10:6;speed+=(target-speed)*dt*.8;if(keys.arrowleft||keys.a||touch.left)playerX-=dt*1.45;if(keys.arrowright||keys.d||touch.right)playerX+=dt*1.45;playerX=Math.max(-1.15,Math.min(1.15,playerX));roadOffset+=speed*dt*60;distance+=speed*dt/3600;for(let o of objects){o.z-= (speed*10-o.z*.018)*dt;if(o.z<25){o.z=1150+Math.random()*300;o.caught=false;o.lane=(Math.random()*3|0)-1}if(!o.caught&&o.z>35&&o.z<155&&Math.abs(o.lane-playerX)<.48){o.caught=true;items++;document.getElementById('items').textContent=String(items).padStart(2,'0')}}for(let p of pedestrians){p.z-=speed*dt*3.8;if(p.z<25){p.z=1150+Math.random()*250;p.lane=(Math.random()*3|0)-1}}if(items>=20)finish();document.getElementById('dist').textContent=distance.toFixed(2)+' KM';document.getElementById('kmh').textContent=String(Math.round(speed*10)).padStart(3,'0');document.getElementById('rpm').style.width=(speed/10*100)+'%'}
function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);ctx.clearRect(0,0,W,H);drawSky();drawBuildings();drawRoad();drawHouseStore();drawSchool();objects.sort((a,b)=>b.z-a.z);pedestrians.sort((a,b)=>b.z-a.z);for(let p of pedestrians)drawPerson(p);for(let o of objects)drawObject(o);drawPlayer();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>

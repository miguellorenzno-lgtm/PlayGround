<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nightfall Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:flex-start}.brand{letter-spacing:.28em;font-weight:900;font-size:12px;text-shadow:0 2px 12px #000}.brand b{color:#ffb21c}.stats{display:flex;gap:8px}.pill{height:48px;min-width:92px;padding:8px 12px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,rgba(10,15,21,.82),rgba(5,7,10,.58));backdrop-filter:blur(12px);border-radius:7px;text-align:right;box-shadow:0 8px 28px rgba(0,0,0,.25)}.pill small{display:block;color:#9aa4af;font-size:8px;letter-spacing:.18em}.pill strong{font-size:18px;font-variant-numeric:tabular-nums}.distance strong{color:#ffd05a}
#speed{position:absolute;left:30px;bottom:28px;width:180px;text-align:left;filter:drop-shadow(0 4px 12px #000)}#speed strong{font-size:58px;font-style:italic;letter-spacing:-5px;line-height:.82}#speed span{font-size:10px;color:#adb5bc;margin-left:8px;letter-spacing:.2em}#gear{color:#ffb21c;font-weight:900;font-size:11px;margin-top:10px}.bar{height:4px;width:170px;margin-top:7px;background:rgba(255,255,255,.14);transform:skewX(-18deg);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35e0ff,#fff176,#ff7b22)}
#objective{position:absolute;top:84px;left:50%;transform:translateX(-50%);text-align:center}.objective-card{padding:8px 18px;border-top:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(90deg,transparent,rgba(5,8,12,.58),transparent);font-size:9px;letter-spacing:.18em}.objective-card b{color:#ffd05a}
#minimap{position:absolute;right:24px;bottom:26px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle,rgba(20,27,35,.72) 0 28%,rgba(5,8,12,.72) 29% 70%,rgba(4,6,9,.86));overflow:hidden}.map-road{position:absolute;left:50%;top:-20%;width:36px;height:150%;transform:translateX(-50%) rotate(8deg);background:#303640;border:1px solid #59616a}.map-player{position:absolute;left:71px;top:84px;width:7px;height:15px;background:#fff;border-radius:4px 4px 2px 2px;box-shadow:0 0 12px #fff}.map-dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffbe38;box-shadow:0 0 6px #ffbe38}
#flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle,transparent 45%,rgba(255,60,20,.75));transition:opacity .15s}
#menu,#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(2,5,8,.82),rgba(2,5,8,.15),rgba(2,5,8,.82));z-index:5}.panel{text-align:center;max-width:620px;padding:24px}.panel .tag{font-size:10px;letter-spacing:.35em;color:#ffbd45}.panel h1{font-size:clamp(48px,9vw,96px);line-height:.82;margin:18px 0 14px;font-style:italic;letter-spacing:-7px;text-transform:uppercase;text-shadow:0 10px 40px #000}.panel h1 span{color:#ffae20}.panel p{color:#bbc3c9;line-height:1.6;margin-bottom:24px}.panel button{pointer-events:auto;border:1px solid rgba(255,255,255,.22);border-radius:4px;background:#eceff1;color:#111;padding:15px 28px;font-weight:900;letter-spacing:.14em;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35)}.hidden{display:none!important}
#controls{display:none}.touch{position:absolute;bottom:18px;width:74px;height:74px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(10,15,20,.38);color:white;font-size:24px;pointer-events:auto;backdrop-filter:blur(8px)}#left{left:18px}#right{left:104px}#boost{right:18px;border-color:rgba(255,182,42,.5);color:#ffc45b}
@media(max-width:700px){.top{top:12px;left:12px;right:12px}.brand{display:none}.pill{height:42px;min-width:72px}.distance{display:none}.top{justify-content:flex-end}#objective{top:62px}.objective-card{font-size:7px}#speed{left:20px;bottom:108px;transform:scale(.72);transform-origin:left bottom}#minimap{width:88px;height:88px;right:12px;bottom:105px}.map-player{left:40px;top:49px}.map-road{width:22px;height:130%}.panel h1{letter-spacing:-4px}#controls{display:block}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="top"><div class="brand">NIGHTFALL <b>// RUN</b></div><div class="stats"><div class="pill"><small>DISTANCE</small><strong id="dist">0.00 KM</strong></div><div class="pill distance"><small>BEST</small><strong id="best">0.00 KM</strong></div><div class="pill"><small>OVERTAKES</small><strong id="passes">00</strong></div></div></div>
<div id="objective"><div class="objective-card">CONTRACT: <b id="contract">PASS 20 CARS</b></div></div><div id="speed"><strong id="kmh">000</strong><span>KM/H</span><div id="gear">GEAR 1</div><div class="bar"><i id="rpm"></i></div></div><div id="minimap"><div class="map-road"></div><div id="mapDots"></div><div class="map-player"></div></div><div id="flash"></div></div>
<div id="menu"><div class="panel"><div class="tag">MIDNIGHT MOTORSPORT</div><h1>Nightfall<br><span>Run</span></h1><p>Desça a rodovia nevada, ultrapasse o tráfego e complete o contrato antes do tanque zerar.</p><button id="start">INICIAR CORRIDA</button></div></div>
<div id="result" class="hidden"><div class="panel"><div class="tag" id="resultTag">MISSÃO CONCLUÍDA</div><h1 id="resultTitle">RUN<br><span>COMPLETE</span></h1><p id="resultText"></p><button id="again">CORRER NOVAMENTE</button></div></div>
<div id="controls"><button class="touch" id="left">◀</button><button class="touch" id="right">▶</button><button class="touch" id="boost">⚡</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);
const keys={},touch={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function bind(id,key){let e=document.getElementById(id);e.addEventListener('pointerdown',q=>{q.preventDefault();touch[key]=1});e.addEventListener('pointerup',()=>touch[key]=0);e.addEventListener('pointercancel',()=>touch[key]=0)}bind('left','left');bind('right','right');bind('boost','boost');
let state='menu',last=0,speed=0,playerX=0,roadOffset=0,distance=0,passes=0,health=100,fuel=100,shake=0,enemy=[];let best=+(localStorage.nightfallBest||0);
document.getElementById('best').textContent=best.toFixed(2)+' KM';
function reset(){speed=0;playerX=0;roadOffset=0;distance=0;passes=0;health=100;fuel=100;shake=0;enemy=[];for(let i=0;i<13;i++)enemy.push(makeEnemy(i));document.getElementById('dist').textContent='0.00 KM';document.getElementById('passes').textContent='00'}
function makeEnemy(i){return{lane:(Math.random()*3|0)-1,z:300+i*240+Math.random()*180,spd:35+Math.random()*95,color:['#b51f20','#1c5a85','#d8d9d1','#2d302f','#8f6a35'][Math.random()*5|0],passed:false}}
function start(){reset();state='run';document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden')}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function finish(win){state='result';if(distance>best){best=distance;localStorage.nightfallBest=best.toFixed(2)}document.getElementById('best').textContent=best.toFixed(2)+' KM';document.getElementById('resultTag').textContent=win?'MISSÃO CONCLUÍDA':'CORRIDA ENCERRADA';document.getElementById('resultTitle').innerHTML=win?'RUN<br><span>COMPLETE</span>':'VEÍCULO<br><span>IMPOSSIBILITADO</span>';document.getElementById('resultText').text='';document.getElementById('resultText').textContent=distance.toFixed(2)+' km • '+passes+' ultrapassagens';document.getElementById('result').classList.remove('hidden')}
function projectLane(lane,z){const horizon=H*.38,p=1-Math.max(0,Math.min(1,z/1100));const y=horizon+(H-horizon)*p*p;const half=W*(.18+.52*p);return{x:W/2+lane*half*.48,y,scale:.12+p*.95,half}}
function roadPolygon(y,yp){let horizon=H*.38;ctx.beginPath();ctx.moveTo(W/2-W*.038,horizon);ctx.lineTo(W/2+W*.038,horizon);ctx.lineTo(W/2+W*.68,yp);ctx.lineTo(W/2-W*.68,yp);ctx.closePath();ctx.fillStyle='#15191d';ctx.fill()}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#07101b');g.addColorStop(.48,'#9aabc1');g.addColorStop(.55,'#f0c28f');g.addColorStop(1,'#d8a06d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.56);ctx.fillStyle='rgba(255,244,210,.75)';ctx.beginPath();ctx.arc(W*.67,H*.34,18,0,7);ctx.fill();ctx.fillStyle='#20272d';for(let i=0;i<12;i++){let x=(i*137)%W,y=H*.28+((i*43)%55);ctx.fillRect(x,y,5+(i%4)*4,H*.12)}ctx.fillStyle='rgba(230,235,238,.32)';for(let i=0;i<16;i++){let x=(i*229+roadOffset*.04)% (W+300)-150,y=H*.06+(i*37)%180;ctx.beginPath();ctx.arc(x,y,2+(i%3),0,7);ctx.fill()}}
function drawRoad(){let horizon=H*.38;let g=ctx.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#50565a');g.addColorStop(.35,'#252a2e');g.addColorStop(1,'#121519');ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);
for(let i=0;i<46;i++){let z=((i*26-roadOffset*.55)%1170+1170)%1170;let p=1-z/1170,y=horizon+(H-horizon)*p*p;if(i%2===0){ctx.fillStyle='rgba(255,255,255,.018)';ctx.fillRect(0,y,W,2+12*p)}}
for(let lane=-2;lane<=2;lane++){ctx.beginPath();for(let i=0;i<=40;i++){let z=i*30;let q=projectLane(lane*1.5,z);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.lineTo(W/2,H);ctx.strokeStyle='rgba(205,214,218,.48)';ctx.lineWidth=1.5;ctx.stroke()}
for(let i=0;i<18;i++){let z=((i*78-roadOffset*.8)%1400+1400)%1400;let q=projectLane(0,z);let p=.12+q.scale*.8;ctx.fillStyle='#dbe0df';ctx.fillRect(q.x-W*(.58+.09*q.scale),q.y,8*p,3*p);ctx.fillStyle='#ff9a35';ctx.fillRect(q.x-W*(.58+.09*q.scale),q.y,3*p,3*p)}
ctx.fillStyle='#bfc4c4';ctx.beginPath();ctx.moveTo(W*.5-W*.038,horizon);ctx.lineTo(W*.5-W*.68,H);ctx.lineTo(W*.5-W*.71,H);ctx.lineTo(W*.5-W*.033,horizon);ctx.fill();ctx.beginPath();ctx.moveTo(W*.5+W*.038,horizon);ctx.lineTo(W*.5+W*.68,H);ctx.lineTo(W*.5+W*.71,H);ctx.lineTo(W*.5+W*.033,horizon);ctx.fill()
}
function drawCar(e){let q=projectLane(e.lane+playerX*.05,e.z),s=q.scale*e.z/300;if(s<.05||e.z<25)return;let x=q.x,y=q.y,w=55*s,h=85*s;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(0,8*s,42*s,12*s,0,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.moveTo(-w*.38,-h*.72);ctx.lineTo(w*.38,-h*.72);ctx.lineTo(w*.48,-h*.18);ctx.lineTo(w*.42,h*.25);ctx.lineTo(-w*.42,h*.25);ctx.lineTo(-w*.48,-h*.18);ctx.closePath();ctx.fill();ctx.fillStyle='#111820';ctx.beginPath();ctx.moveTo(-w*.29,-h*.58);ctx.lineTo(w*.29,-h*.58);ctx.lineTo(w*.35,-h*.27);ctx.lineTo(-w*.35,-h*.27);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,70,45,.9)';ctx.fillRect(-w*.34,h*.12,w*.18,h*.09);ctx.fillRect(w*.16,h*.12,w*.18,h*.09);ctx.restore()}
function drawPlayer(){let x=W/2+playerX*W*.34,y=H*.82,w=Math.min(W*.13,125),h=w*1.45;ctx.save();ctx.translate(x+(Math.random()-.5)*shake,y+(Math.random()-.5)*shake);ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(0,h*.25,w*.68,h*.13,0,0,7);ctx.fill();let g=ctx.createLinearGradient(-w*.5,-h*.7,w*.5,h*.3);g.addColorStop(0,'#424b51');g.addColorStop(.45,'#15191c');g.addColorStop(.52,'#69757a');g.addColorStop(1,'#090b0d');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-w*.36,-h*.58);ctx.lineTo(w*.36,-h*.58);ctx.lineTo(w*.5,-h*.28);ctx.lineTo(w*.43,h*.32);ctx.lineTo(-w*.43,h*.32);ctx.lineTo(-w*.5,-h*.28);ctx.closePath();ctx.fill();ctx.fillStyle='#0b1115';ctx.beginPath();ctx.moveTo(-w*.28,-h*.48);ctx.lineTo(w*.28,-h*.48);ctx.lineTo(w*.34,-h*.16);ctx.lineTo(-w*.34,-h*.16);ctx.closePath();ctx.fill();ctx.fillStyle='#c8e3ef';ctx.beginPath();ctx.moveTo(-w*.31,-h*.43);ctx.lineTo(w*.31,-h*.43);ctx.lineTo(w*.33,-h*.28);ctx.lineTo(-w*.33,-h*.28);ctx.closePath();ctx.fill();ctx.fillStyle='#d5faff';ctx.fillRect(-w*.38,h*.13,w*.22,h*.08);ctx.fillRect(w*.16,h*.13,w*.22,h*.08);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-w*.34,-h*.25,w*.68,h*.02);ctx.restore()}
function update(dt){if(state!=='run')return;let boosting=(keys.shift||keys.shiftKey||touch.boost)&&fuel>0;let target=boosting?238:178;speed+=(target-speed)*dt*.8;if(speed<35)speed+=dt*22;if(keys.arrowleft||keys.a||touch.left)playerX-=dt*1.5;if(keys.arrowright||keys.d||touch.right)playerX+=dt*1.5;playerX=Math.max(-1.15,Math.min(1.15,playerX));roadOffset+=speed*dt*5.8;distance+=speed*dt/3600;if(boosting){fuel-=dt*7}else fuel=Math.min(100,fuel+dt*1.2);health=Math.max(0,health);for(let e of enemy){e.z-= (speed-e.spd*.18)*dt;if(e.z<30){e.z=1150+Math.random()*280;e.passed=false;e.lane=(Math.random()*3|0)-1;e.spd=35+Math.random()*95;e.color=['#b51f20','#1c5a85','#d8d9d1','#2d302f','#8f6a35'][Math.random()*5|0]}if(!e.passed&&e.z<15){e.passed=true;passes++;document.getElementById('passes').textContent=String(passes).padStart(2,'0')}if(e.z>35&&e.z<155&&Math.abs(e.lane-playerX)<.5){health-=dt*30;shake=4;document.getElementById('flash').style.opacity='.7';setTimeout(()=>document.getElementById('flash').style.opacity='0',80)}}if(passes>=20)finish(true);if(health<=0||fuel<=0&&distance>0.05)finish(false);document.getElementById('dist').textContent=distance.toFixed(2)+' KM';document.getElementById('kmh').textContent=String(Math.round(speed)).padStart(3,'0');document.getElementById('gear').textContent='GEAR '+Math.min(6,Math.max(1,Math.ceil(speed/42)));document.getElementById('rpm').style.width=(speed/238*100)+'%'}
function frame(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);ctx.clearRect(0,0,W,H);ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}drawSky();drawRoad();enemy.sort((a,b)=>b.z-a.z);for(let e of enemy){if(e.z>80)drawCar(e)}drawPlayer();ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
